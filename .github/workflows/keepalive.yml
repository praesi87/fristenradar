# Kostenlose Supabase-Projekte werden nach 7 Tagen ohne Aktivität pausiert.
# Dieser Job fragt alle 3 Tage die Funktion public.ping() ab (liefert nur "ok", keine Daten).
# Hinweis: Ob Supabase das dauerhaft als Aktivität wertet, ist nicht garantiert – bei Pausierung
# im Supabase-Dashboard auf "Restore project" klicken.
name: Supabase wach halten

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.SUPABASE_URL != '' }}
    steps:
      - name: ping()
        run: |
          code=$(curl -s -o /tmp/antwort -w "%{http_code}" -X POST "${{ vars.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code: $(cat /tmp/antwort)"
          test "$code" = "200"
